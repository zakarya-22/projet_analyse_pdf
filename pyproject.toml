[project]
name = "credit-risk-audit"
version = "0.2.0"
description = "Pipeline hybride ML + RAG pour l'audit du risque de credit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.32,<2", "pandas>=2.2,<3", "numpy>=1.26,<3",
    "xgboost>=3.4,<3.5", "scikit-learn>=1.4,<2", "joblib>=1.3,<2",
    "shap>=0.52,<0.53", "numba>=0.68,<0.69", "llvmlite>=0.50,<0.51", "pdfplumber>=0.10,<1",
    "langchain-community==0.3.31", "langchain-core>=1.6,<2",
    "langchain-ollama>=1.1,<2", "langchain-text-splitters>=1,<2",
    "sentence-transformers>=6.1,<7", "chromadb>=1.5,<2",
    "rank-bm25>=0.2.2,<0.3", "matplotlib>=3.8,<4", "torch>=2.6,<3",
]

[project.optional-dependencies]
eval = ["ragas==0.4.3", "instructor>=1.14,<2"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
